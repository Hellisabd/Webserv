<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 ຫ້າມ</title>
    <style>
        /* Styles généraux */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 4em;
            margin: 0.2em;
            color: #e74c3c;
        }
        p {
            font-size: 1.2em;
            margin: 0.5em;
        }
        a {
            display: inline-block;
            margin-top: 1em;
            padding: 0.5em 1em;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1em;
        }
        a:hover {
            background-color: #2980b9;
        }

        /* Styles du bouton drapeau du Laos */
        .laos-flag-button {
            display: inline-block;
            width: 120px;
            height: 60px;
            border: none;
            cursor: pointer;
            position: relative;
            background-color: transparent;
            margin-top: 2em;
        }
        .laos-flag-button::before,
        .laos-flag-button::after {
            content: '';
            display: block;
            width: 100%;
            height: 20%;
            background-color: #CE1126;
            position: absolute;
        }
        .laos-flag-button::before {
            top: 0;
        }
        .laos-flag-button::after {
            bottom: 0;
        }
        .laos-flag-button .blue-band {
            background-color: #002868;
            height: 60%;
            width: 100%;
            position: absolute;
            top: 20%;
        }
        .laos-flag-button .circle {
            background-color: white;
            width: 25%;
            height: 50%;
            border-radius: 50%;
            position: absolute;
            top: 25%;
            left: 37.5%;
        }
    </style>
</head>
<body>

    <!-- Message d'erreur 403 -->
    <h1>403</h1>
    <p>ໝົດເວລາ!</p>
    <p>ກະລຸນາໄວຂຶ້ນ!</p>
    <a href="https://translate.google.fr/?hl=fr&sl=auto&tl=fr&text=%E0%BB%9D%E0%BA%BB%E0%BA%94%E0%BB%80%E0%BA%A7%E0%BA%A5%E0%BA%B2!%0A%E0%BA%81%E0%BA%B0%E0%BA%A5%E0%BA%B8%E0%BA%99%E0%BA%B2%E0%BB%84%E0%BA%A7%E0%BA%82%E0%BA%B6%E0%BB%89%E0%BA%99!&op=translate">ການແປ</a>

    <!-- Bouton représentant le drapeau du Laos -->
    <button class="laos-flag-button" onclick="window.location.href='/'">
        <div class="blue-band"></div>
        <div class="circle"></div>
    </button>

</body>
</html>
