<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 找不到页面</title>
    <style>
        /* Styles généraux */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 4em;
            margin: 0.2em;
            color: #e74c3c;
        }
        p {
            font-size: 1.2em;
            margin: 0.5em;
        }
        a {
            display: inline-block;
            margin-top: 1em;
            padding: 0.5em 1em;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1em;
        }
        a:hover {
            background-color: #2980b9;
        }

        /* Styles du bouton drapeau de la Chine */
        .china-flag-button {
            display: inline-block;
            width: 120px;
            height: 80px;
            border: none;
            cursor: pointer;
            position: relative;
            background-color: #DE2910;
            margin-top: 2em;
        }
        /* Étoile jaune principale */
        .china-flag-button .star-large {
            position: absolute;
            top: 10%;
            left: 10%;
            color: #FFDE00;
            font-size: 24px;
            transform: rotate(20deg);
        }
        /* Petites étoiles */
        .china-flag-button .star-small:nth-child(2) { top: 20%; left: 35%; transform: rotate(25deg); }
        .china-flag-button .star-small:nth-child(3) { top: 35%; left: 30%; transform: rotate(45deg); }
        .china-flag-button .star-small:nth-child(4) { top: 50%; left: 22%; transform: rotate(65deg); }
        .china-flag-button .star-small:nth-child(5) { top: 60%; left: 15%; transform: rotate(90deg); }
        
        .china-flag-button .star-small {
            position: absolute;
            color: #FFDE00;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Message d'erreur 404 -->
    <h1>404</h1>
    <p>哎呀！您正在寻找的页面不存在</p>
    <p>它可能已被删除或 URL 可能不正确</p>
    <a href="https://translate.google.fr/?hl=fr&sl=auto&tl=fr&text=%E5%93%8E%E5%91%80%EF%BC%81%E6%82%A8%E6%AD%A3%E5%9C%A8%E5%AF%BB%E6%89%BE%E7%9A%84%E9%A1%B5%E9%9D%A2%E4%B8%8D%E5%AD%98%E5%9C%A8%0A%E5%AE%83%E5%8F%AF%E8%83%BD%E5%B7%B2%E8%A2%AB%E5%88%A0%E9%99%A4%E6%88%96%20URL%20%E5%8F%AF%E8%83%BD%E4%B8%8D%E6%AD%A3%E7%A1%AE&op=translate">翻译</a>

    <!-- Bouton représentant le drapeau de la Chine -->
    <button class="china-flag-button" onclick="window.location.href='/'">
        <div class="star-large">★</div>
        <div class="star-small">★</div>
        <div class="star-small">★</div>
        <div class="star-small">★</div>
    </button>

</body>
</html>
