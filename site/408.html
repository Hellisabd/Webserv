<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408 Χρονικό όριο αιτήματος</title>
    <style>
        /* Styles généraux */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 4em;
            margin: 0.2em;
            color: #e74c3c;
        }
        p {
            font-size: 1.2em;
            margin: 0.5em;
        }
        a {
            display: inline-block;
            margin-top: 1em;
            padding: 0.5em 1em;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1em;
        }
        a:hover {
            background-color: #2980b9;
        }

        /* Styles du bouton drapeau grec */
        .greece-flag-button {
            display: inline-block;
            width: 120px;
            height: 80px;
            position: relative;
            background-color: #0d5eaf; /* Bleu */
            margin-top: 2em;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            border: 1px solid #ccc;
            overflow: hidden;
        }
        /* Les bandes horizontales */
        .greece-flag-button .stripe {
            position: absolute;
            width: 100%;
            height: 12.5%; /* 1/8 de la hauteur */
            background-color: white;
        }
        .greece-flag-button .stripe:nth-child(2n) {
            background-color: #0d5eaf; /* Bleu pour les bandes impaires */
        }

        /* Le carré bleu avec croix blanche */
        .greece-flag-button .blue-square {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 50%;
            background-color: #0d5eaf;
        }
        .greece-flag-button .blue-square::before,
        .greece-flag-button .blue-square::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        /* Croisement horizontal et vertical */
        .greece-flag-button .blue-square::before {
            top: 40%;
            left: 0;
            width: 100%;
            height: 20%;
        }
        .greece-flag-button .blue-square::after {
            top: 0;
            left: 40%;
            width: 20%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Message d'erreur 408 -->
    <h1>408</h1>
    <p>ເຈົ້າຈະບໍ່ຜ່ານ!</p>
    <p>Παρακαλώ προσπαθήστε ξανά.</p>
    <a href="https://translate.google.fr/?hl=fr&sl=el&tl=fr&text=%CE%97%20%CF%87%CF%81%CE%BF%CE%BD%CE%B9%CE%BA%CE%AE%20%CE%B4%CE%B9%CE%AC%CF%81%CE%BA%CE%B5%CE%B9%CE%B1%20%CF%84%CE%BF%CF%85%20%CE%B1%CE%B9%CF%84%CE%AE%CE%BC%CE%B1%CF%84%CE%BF%CF%82%20%CE%AD%CE%BB%CE%B7%CE%BE%CE%B5!%0A%CE%A0%CE%B1%CF%81%CE%B1%CE%BA%CE%B1%CE%BB%CF%8E%20%CF%80%CF%81%CE%BF%CF%83%CF%80%CE%B1%CE%B8%CE%AE%CF%83%CF%84%CE%B5%20%CE%BE%CE%B1%CE%BD%CE%AC.&op=translate">Επιστροφή στην αρχική</a>

    <!-- Bouton représentant le drapeau de la Grèce -->
    <button class="greece-flag-button" onclick="window.location.href='/'">
        <!-- Bandes horizontales -->
        <div class="stripe" style="top: 0;"></div>
        <div class="stripe" style="top: 12.5%;"></div>
        <div class="stripe" style="top: 25%;"></div>
        <div class="stripe" style="top: 37.5%;"></div>
        <div class="stripe" style="top: 50%;"></div>
        <div class="stripe" style="top: 62.5%;"></div>
        <div class="stripe" style="top: 75%;"></div>
        <div class="stripe" style="top: 87.5%;"></div>
        <!-- Carré bleu avec croix blanche -->
        <div class="blue-square"></div>
    </button>

</body>
</html>
