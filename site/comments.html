<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Comments about Webserv</title>
</head>
<body>
<h1>Comments</h1>
	<div class="comment">
		<strong>sds:</strong><br>
		<p>sdvsv<br></p>
	</div>
	<div class="comment">
		<strong>oui:</strong><br>
		<p>oui+non+oui%0D%0A<br></p>
	</div>
	<div class="comment">
		<strong>dsad:</strong><br>
		<p></p>
	</div>
	<div class="comment">
		<strong>ok:</strong><br>
		<p>ok ok ok<br></p>
	</div>
	<div class="comment">
		<strong>oui:</strong><br>
		<p>oui%0D%0Aoui oui%0D%0Aoui oui oui<br></p>
	</div>
	<div class="comment">
		<strong>non:</strong><br>
		<p>non<br>non<br>non non<br></p>
	</div>
	<h2>Leave a comment</h2>
	<form action="/submit_comment" method="POST">
		<label for="pseudo">Pseudo:</label><br>
		<input type="text" id="pseudo" name="pseudo" required><br><br>
		<label for="comment">Comment:</label><br>
		<textarea id="comment" name="comment" rows="4" cols="50" required></textarea><br><br>
		<input type="submit" value="Send">
	</form>
</body>
</html>
