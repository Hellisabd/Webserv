<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Comments about Webserv</title>
</head>
<body>
<h1>Comments</h1>
	<div class="comment">
		<strong>Antoine:</strong><br>
		<p>blabla<br>blablabla<br>blablablabla<br></p>
	</div>
	<div class="comment">
		<strong>Basile:</strong><br>
		<p>ouais<br></p>
	</div>
	<div class="comment">
		<strong>Alexis:</strong><br>
		<p>POST GET POST<br>GET GET<br>DELETE<br>PUT<br></p>
	</div>
	<h2>Leave a comment</h2>
	<form action="/submit_comment" method="POST">
		<label for="pseudo">Pseudo:</label><br>
		<input type="text" id="pseudo" name="pseudo" required><br><br>
		<label for="commentaire">Comment:</label><br>
		<textarea id="commentaire" name="commentaire" rows="4" cols="50" required></textarea><br><br>
		<input type="submit" value="Send">
	</form>
</body>
</html>
