<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Uploads</title>
	<style>
		body {
			a {
				display: inline-block;
				margin-top: 1em;
				padding: 0.5em 1em;
				background-color: #3498db;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				font-size: 1em;
			}
			a.download {
				background-color: #16b84e;
			}
		}
</style>
</head>
<body>
<h1>Upload</h1>
	<form action="/cgi-bin/upload.py" method="POST" enctype="multipart/form-data">
		<label for="file">Pick a file:</label>
		<input type="file" id="file" name="file">
		<button type="submit">Upload</button>
	</form>
<h2>Downloads</h2>
<table>
<tr>
	<td>📁 1.txt</td>
	<td><a href="./downloads/1.txt" class=download download="1.txt">Download</a></td></tr>
</table>
<a href="/">HOME</a>
</body>
</html>
